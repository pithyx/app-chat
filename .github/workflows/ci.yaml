# Tests and packs the app on every push and pull request: pithyx build builds the backend's image for this runner and
# pins backend/compose.yaml and the lock to it, so the package carries the image (pithyx pack --images) and installs as
# a sideload. A published release gets the .pithyxapp attached. In a catalog, the catalog's CI builds the images itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install @pithyx/cli 1.0.0-rc.5
        run: |
          npm install --global --no-audit --no-fund @pithyx/cli@1.0.0-rc.5
          echo "PITHYX=$(npm prefix --global)/bin/pithyx" >>"$GITHUB_ENV"
      - name: Build the backend image
        run: '"$PITHYX" build'
      - run: npm test
      - name: Pack with the image
        run: '"$PITHYX" pack --images'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pithyxapp
          path: '*.pithyxapp'
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pithyxapp
      - run: gh release upload "$TAG" ./*.pithyxapp --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
