# Tests and packs the app on every push and pull request; a published release gets the .pithyxapp attached. A manual
# run with "publish-image" builds the backend image for amd64 and arm64 and pushes it to the GitHub container registry
# (then run `npm run pin` with the printed digest, see the README).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-image:
        description: Build and push the backend image
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: pithyxapp
          path: '*.pithyxapp'
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: pithyxapp
      - run: gh release upload "$TAG" ./*.pithyxapp --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

  image:
    if: github.event_name == 'workflow_dispatch' && inputs.publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-server:$(node -p 'require("./pithyx.json").version')" >>"$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: backend/server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}
          provenance: false
      - run: echo "Pin it with npm run pin -- ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" >>"$GITHUB_STEP_SUMMARY"
