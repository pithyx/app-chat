# The chat's backend in its source form: the server is built from backend/server. `pithyx build` builds it and writes
# backend/compose.yaml with the image pinned by digest plus backend/images.lock.json; a catalog builds it the same way
# and pushes the image itself. `npm run dev` (pithyx dev) runs this file with docker compose.
services:
  server:
    build: ./server
    volumes:
      - data:/data
    tmpfs:
      - /tmp
    read_only: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      start_interval: 1s
      retries: 3

volumes:
  data:
